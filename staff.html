<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Portfolio Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- นำเข้า Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Prompt', 'Inter', sans-serif; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); }
        .cyber-grid { background-image: radial-gradient(rgba(244, 63, 94, 0.1) 1px, transparent 1px); background-size: 24px 24px; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col cyber-grid relative overflow-x-hidden">

    <header class="border-b border-rose-900/50 bg-slate-950/80 backdrop-blur-md sticky top-0 z-40 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 to-red-600 flex items-center justify-center shadow-lg shadow-rose-500/30">
                <span class="text-xl">🛠️</span>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-wider text-rose-400">STAFF DASHBOARD</h1>
                <p class="text-[10px] text-slate-400 tracking-wider">ระบบจัดการ Portfolio Showcase</p>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto w-full px-4 py-8 flex flex-col items-center justify-center relative z-10">
        
        <!-- โซนล็อคอิน (แสดงตอนแรก) -->
        <div id="login-section" class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-sm w-full text-center space-y-6 shadow-2xl animate-float">
            <div class="text-5xl">🔒</div>
            <div class="space-y-2">
                <h3 class="text-2xl font-bold text-white">Staff Login</h3>
                <p class="text-slate-400 text-sm">กรุณาใส่รหัสผ่านเพื่อเข้าสู่ระบบ</p>
            </div>
            <input type="password" id="login-password" placeholder="Password..." 
                   class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-center focus:outline-none focus:border-rose-500 transition-colors">
            <button onclick="checkLogin()" class="w-full py-3 bg-rose-600 hover:bg-rose-500 font-bold rounded-xl text-white transition-all shadow-lg shadow-rose-500/20">เข้าสู่ระบบ</button>
        </div>

        <!-- โซนจัดการข้อมูล (ซ่อนไว้ก่อนล็อคอินผ่าน) -->
        <div id="dashboard-section" class="hidden w-full space-y-6">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-2xl font-bold text-white">ตารางคะแนนกิจกรรม</h2>
                    <p class="text-slate-400 text-sm">คุณสามารถลบข้อมูลที่ไม่ต้องการได้ที่นี่</p>
                </div>
                <div class="text-xs text-rose-400 bg-rose-950/50 px-3 py-1.5 rounded-lg border border-rose-900">
                    🟢 ดึงข้อมูลแบบ Real-time
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                <div id="staff-leaderboard-list" class="divide-y divide-slate-800/50 max-h-[60vh] overflow-y-auto p-4 space-y-2">
                    <!-- โชว์รายชื่อที่นี่ -->
                </div>
            </div>
        </div>

    </main>

    <!-- Custom Modal ยืนยันการลบ -->
    <div id="confirm-delete-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[60] flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-rose-900/50 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center space-y-6 shadow-2xl animate-float">
            <div class="text-5xl">⚠️</div>
            <div class="space-y-2">
                <h3 class="text-2xl font-bold text-white">ยืนยันการลบข้อมูล?</h3>
                <p id="delete-target-name" class="text-slate-400 text-sm break-words">คุณต้องการลบ "..." ใช่หรือไม่?</p>
            </div>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="w-1/2 py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 transition-all text-sm font-medium">ยกเลิก</button>
                <button onclick="executeDelete()" class="w-1/2 py-3 bg-rose-600 hover:bg-rose-500 font-bold rounded-xl text-white transition-all shadow-lg shadow-rose-500/20">ลบข้อมูล</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal แจ้งเตือนข้อผิดพลาดรหัสผ่าน -->
    <div id="error-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[70] flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-rose-900/50 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center space-y-6 shadow-2xl">
            <div class="text-5xl">❌</div>
            <h3 class="text-2xl font-bold text-white">รหัสผ่านไม่ถูกต้อง!</h3>
            <button onclick="document.getElementById('error-modal').classList.add('hidden')" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-white font-bold transition-all">ลองใหม่</button>
        </div>
    </div>

    <script>
        // การตั้งค่า Firebase (ชุดเดียวกับฝั่งคนเล่น)
        const firebaseConfig = {
            apiKey: "AIzaSyDzBz65IEWjI1FcsMCshIHKkb2bESXECI0",
            authDomain: "flowchart-portfolio.firebaseapp.com",
            projectId: "flowchart-portfolio",
            storageBucket: "flowchart-portfolio.firebasestorage.app",
            messagingSenderId: "18428996800",
            appId: "1:18428996800:web:974859ac7e31d11a155125",
            measurementId: "G-YVMZ2RWCHZ",
            databaseURL: "https://flowchart-portfolio-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        let leaderboard = [];

        // ฟังก์ชันล็อคอิน
        function checkLogin() {
            const pwd = document.getElementById('login-password').value;
            if (pwd === "ITS") {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                fetchLeaderboard(); // โหลดข้อมูลมาโชว์
            } else {
                document.getElementById('error-modal').classList.remove('hidden');
            }
        }

        // โหลดข้อมูลแบบ Real-time
        function fetchLeaderboard() {
            database.ref('leaderboard').on('value', (snapshot) => {
                const data = snapshot.val();
                let newLeaderboard = [];
                if (data) {
                    for (let key in data) {
                        newLeaderboard.push({ id: key, name: data[key].name, score: data[key].score, timestamp: data[key].timestamp || 0 });
                    }
                }
                newLeaderboard.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.timestamp - b.timestamp; 
                });
                leaderboard = newLeaderboard;
                renderStaffLeaderboard();
            });
        }

        // วาดตารางฝั่งสตาฟฟ์ (มีปุ่มลบ)
        function renderStaffLeaderboard() {
            const list = document.getElementById('staff-leaderboard-list');
            list.innerHTML = '';
            if (leaderboard.length === 0) list.innerHTML = `<p class="text-center py-8 text-slate-500">ว่างเปล่า ไม่มีข้อมูลในระบบ</p>`;
            leaderboard.forEach((entry, i) => {
                let rank = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
                list.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-950/50 p-4 rounded-xl border border-slate-800 hover:border-slate-600 transition-colors">
                        <div class="flex gap-4 items-center">
                            <span class="w-8 text-center text-lg">${rank}</span>
                            <div>
                                <div class="font-bold text-slate-100">${entry.name}</div>
                                <div class="text-xs text-slate-500">ID: ${entry.id.substring(0,8)}...</div>
                            </div>
                        </div>
                        <div class="flex gap-6 items-center">
                            <span class="text-yellow-400 font-bold">${entry.score} pts</span>
                            <button onclick="openDeleteModal(${i})" class="w-10 h-10 flex items-center justify-center rounded-lg bg-rose-950/50 text-rose-500 hover:bg-rose-600 hover:text-white transition-colors border border-rose-900/50">🗑️</button>
                        </div>
                    </div>`;
            });
        }

        // ระบบยืนยันการลบแบบ Custom Modal (ไม่มี popup browser)
        let entryToDeleteId = null;

        function openDeleteModal(index) {
            const entry = leaderboard[index];
            entryToDeleteId = entry.id;
            document.getElementById('delete-target-name').innerText = `ลบผู้เล่น: "${entry.name}" ใช่หรือไม่?`;
            document.getElementById('confirm-delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            entryToDeleteId = null;
            document.getElementById('confirm-delete-modal').classList.add('hidden');
        }

        function executeDelete() {
            if (entryToDeleteId) {
                database.ref('leaderboard/' + entryToDeleteId).remove();
            }
            closeDeleteModal();
        }
    </script>
</body>
</html>
