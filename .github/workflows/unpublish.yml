name: Auto Unpublish GitHub Pages

on:
  schedule:
    # รันวันที่ 30 กันยายน เวลา 06:00 UTC (ตรงกับ 13:00 น. เวลาไทย)
    - cron: '0 6 30 9 *'
  
  workflow_dispatch: # เปิดไว้เผื่อกรณีที่คุณอยากกดสั่งหยุดเว็บด้วยมือตัวเองทันที

jobs:
  unpublish:
    runs-on: ubuntu-latest
    permissions:
      pages: write      
      id-token: write
    steps:
      - name: Delete GitHub Pages Site
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pages.deletePagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              console.log("Successfully unpublished the site.");
            } catch (error) {
              if (error.status === 404) {
                console.log("Pages site already deleted or does not exist.");
              } else {
                throw error;
              }
            }
